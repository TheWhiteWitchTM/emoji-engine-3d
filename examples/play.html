<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Witch Hunt</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #111; }
    body { display: flex; justify-content: center; padding: 24px; }
  </style>
</head>
<body>
  <script src="../browser/emoji-engine-3d.js"></script>
  <script>
    const cellWidth = 12;
    const cellHeight = 18;
    const { Canvas, Engine, Terminal, Utilities } = EmojiEngine3D;

    const problems = [];
    const expect = (ok, message) => { if (!ok) problems.push(message); };

    try {
      const engine = new Engine({ width: 480, height: 270, antialias: false, pixelRatio: 1 });
      const ui = Utilities.wrap(engine.canvas, { title: 'Witch Hunt' });
      document.body.appendChild(ui.wrap);
      ui.headerMiddle.textContent = 'demo';

      const term = new Terminal({
        cols: 36,
        rows: 4,
        canvas: engine.canvas,
        cellWidth,
        cellHeight,
        layer: 'terminal',
      });
      term.write('Witch Hunt\n');
      term.write('A hunter crosses the heath.');

      const ground = engine.box(0, -0.15, 0, 24, 0.3, 24, '#3d5c3a');
      engine.box(-3.5, 0.7, 2.4, 0.6, 1.6, 0.6, '#6b4a2f');
      engine.box(3.6, 0.55, -1.6, 0.5, 1.3, 0.5, '#5c4030');
      engine.box(3.4, 0.16, 3.1, 0.9, 0.32, 0.6, '#7a756c');
      engine.box(-3.2, 0.12, -2.2, 0.7, 0.24, 0.5, '#6e6a62');

      const witch = engine.sprite('🧙‍♀️', 0, 0.6, 0, 1.2);
      const hunter = engine.sprite('✝️', 0, 0.5, 5, 1);
      engine.motion(hunter, 0, 0, -0.15);
      engine.canvas.followDistance = 7;
      engine.canvas.followHeight = 3;
      engine.canvas.follow(witch);

      checkChrome();
      checkTerminal();
      checkFrame();
      checkProject();
      checkFollow();
      checkCollision();
      checkKeys();
      checkPixels();
      expect(ground.sensor === false && witch.radius === 0.6, 'scene bodies');

      const report = problems.length === 0 ? 'browser ok' : problems.join('; ');
      document.body.dataset.ee = report;
      ui.footer.textContent = problems.length === 0 ? 'browser ok · arrow keys steer' : report;
      if (problems.length) ui.footer.style.color = '#ffb4b4';

      let playing = problems.length === 0;
      if (playing) {
        const off = engine.onCollision((a, b) => {
          if (a !== witch && b !== witch) return;
          if (a !== hunter && b !== hunter) return;
          off();
          playing = false;
          engine.motion(hunter, 0, 0, 0);
          engine.motion(witch, 0, 0, 0);
          term.write('\nThey meet.');
          ui.footer.textContent = `browser ok · ${a.emoji} hit ${b.emoji}`;
          engine.beep(523, 80);
        });
        engine.start();
        requestAnimationFrame(steer);
      } else {
        engine.canvas.draw();
      }

      function steer() {
        if (!playing) return;
        const turn = (engine.isKeyDown('ArrowLeft') ? 1 : 0) - (engine.isKeyDown('ArrowRight') ? 1 : 0);
        witch.yaw += turn * 0.045;
        const ahead = Canvas.forward(witch.yaw, 0);
        const move = (engine.isKeyDown('ArrowUp') ? 1 : 0) - (engine.isKeyDown('ArrowDown') ? 1 : 0);
        const speed = 0.08;
        engine.motion(witch, ahead.x * move * speed, 0, ahead.z * move * speed);
        requestAnimationFrame(steer);
      }

      function checkChrome() {
        const middle = ui.headerMiddle;
        const header = middle && middle.parentElement;
        expect(Boolean(middle && header && ui.footer), 'chrome missing');
        if (!header || !ui.footer) return;
        const parts = Array.from(header.children);
        expect(parts.length === 3, 'header parts');
        expect(parts[0].textContent === 'Witch Hunt', 'title');
        expect(parts[0].className === 'ee-title', 'title class');
        expect(parts[1] === middle && parts[1].className === 'ee-middle', 'middle slot');
        expect(parts[2].tagName === 'BUTTON' && parts[2].className === 'ee-fullscreen', 'fullscreen button');
        expect(parts[2].textContent === 'F11 Fullscreen', 'fullscreen label');
        expect(ui.wrap.className === 'ee-wrap', 'wrap class');
        expect(header.className === 'ee-header', 'header class');
        expect(ui.footer.tagName === 'DIV' && ui.footer.className === 'ee-footer', 'footer');
        expect(engine.canvas.element.parentElement === ui.wrap, 'canvas wrapped');
        const order = Array.from(ui.wrap.children).map((node) => node.tagName).join(',');
        expect(order === 'HEADER,CANVAS,DIV', 'wrap order ' + order);
        ui.setTitle('Night Hunt');
        expect(parts[0].textContent === 'Night Hunt', 'setTitle');
        ui.setTitle('Witch Hunt');
      }

      function checkTerminal() {
        expect(rowText(0) === 'Witch Hunt', 'row 0');
        expect(rowText(1) === 'A hunter crosses the heath.', 'row 1');
        expect(term.canvas === engine.canvas, 'shared canvas');
        expect(term.get(0, 0).fg === 15, 'plain fg');
      }

      function rowText(row) {
        let text = '';
        for (let col = 0; col < term.cols; col += 1) text += term.get(col, row).ch;
        return text.replace(/\s+$/, '');
      }

      function checkFrame() {
        const ahead = Canvas.forward(0, 0);
        const turned = Canvas.forward(Math.PI / 2, 0);
        const up = Canvas.forward(0, Math.PI / 2);
        const right = Canvas.right(0);
        const rightTurned = Canvas.right(Math.PI / 2);
        expect(near(ahead, 0, 0, -1), 'forward yaw 0');
        expect(near(turned, -1, 0, 0), 'forward yaw quarter');
        expect(near(up, 0, 1, 0), 'forward pitch up');
        expect(near(right, 1, 0, 0), 'right yaw 0');
        expect(near(rightTurned, 0, 0, -1), 'right yaw quarter');
      }

      function checkProject() {
        const view = new Canvas({ width: 200, height: 200, pixelRatio: 1, antialias: false });
        view.camera.fov = 90;
        view.camera.near = 0.1;
        view.camera.far = 100;
        view.setCamera(0, 0, 5, 0, 0);
        const origin = view.project(0, 0, 0);
        expect(Math.abs(origin.x) < 1e-4 && Math.abs(origin.y) < 1e-4 && !origin.behind, 'origin ndc');
        const edge = view.project(5, 0, 0);
        expect(Math.abs(edge.x - 1) < 1e-3, 'screen right ' + edge.x);
        const top = view.project(0, 5, 0);
        expect(Math.abs(top.y - 1) < 1e-3, 'screen top ' + top.y);
        const back = view.project(0, 0, 6);
        expect(back.behind, 'point behind the eye');
        view.setCamera(0, 0, 0, Math.PI / 2, 0);
        const nose = view.project(-5, 0, 0);
        expect(Math.abs(nose.x) < 1e-3 && !nose.behind, 'look -x');
        const side = view.project(-5, 0, -5);
        expect(side.x > 0.9, 'screen right while looking -x ' + side.x);
      }

      function checkFollow() {
        const followed = new Engine({ width: 200, height: 200, antialias: false, pixelRatio: 1 });
        const target = followed.sprite('🧙‍♀️', 2, 1, -3, 1);
        target.yaw = 0;
        followed.canvas.followDistance = 6;
        followed.canvas.followHeight = 2.5;
        followed.canvas.follow(target);
        followed.canvas.draw();
        const eye = followed.canvas.camera.eye;
        expect(Math.abs(eye.x - 2) < 1e-4 && Math.abs(eye.y - 3.5) < 1e-4 && Math.abs(eye.z - 3) < 1e-4, 'follow eye');
        expect(Math.abs(followed.canvas.camera.yaw) < 1e-4, 'follow yaw');
        expect(followed.canvas.camera.pitch < -0.3, 'follow pitch ' + followed.canvas.camera.pitch);
        followed.canvas.setCamera(0, 0, 0, 1, 0);
        followed.canvas.draw();
        expect(Math.abs(followed.canvas.camera.eye.z - 3) < 1e-4, 'follow keeps the eye');
        followed.canvas.follow(null);
        followed.canvas.setCamera(1, 2, 3, 0.4, -0.2);
        followed.canvas.draw();
        expect(Math.abs(followed.canvas.camera.eye.x - 1) < 1e-4, 'setCamera after follow');
      }

      function checkCollision() {
        const box = new Engine({ width: 64, height: 64, antialias: false, pixelRatio: 1 });
        const first = box.sprite('A', 0, 0, 0, 1);
        const second = box.sprite('B', 0, 0, 0, 1);
        let hits = 0;
        let order = '';
        const off = box.onCollision((a, b) => {
          hits += 1;
          order = a.emoji + b.emoji;
        });
        box.update();
        expect(hits === 1 && order === 'AB', 'contact ' + hits + ' ' + order);
        second.z = 1.01;
        box.update();
        expect(hits === 1, 'separated pair reported again');
        second.z = 0;
        off();
        box.update();
        expect(hits === 1, 'unsubscribe');
        first.x = NaN;
        const extra = box.onCollision(() => { hits += 1; });
        box.update();
        expect(hits === 1, 'non-finite pair');
        extra();

        const wallWorld = new Engine({ width: 64, height: 64, antialias: false, pixelRatio: 1 });
        const wall = wallWorld.box(0, 0, 0, 1, 2, 4, '#888888');
        wall.yaw = Math.PI / 2;
        const body = wallWorld.sprite('o', 0, 0, 1, 0.6);
        wallWorld.motion(body, 0, 0, -0.4);
        let solidHits = 0;
        wallWorld.onCollision(() => { solidHits += 1; });
        wallWorld.update();
        expect(Math.abs(body.z - 0.8) < 1e-4, 'solid push ' + body.z);
        expect(solidHits === 0, 'solid reported a hit');
      }

      function checkKeys() {
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'k' }));
        expect(engine.isKeyDown('k'), 'keydown');
        window.dispatchEvent(new KeyboardEvent('keyup', { key: 'k' }));
        expect(!engine.isKeyDown('k'), 'keyup');
        engine.beep(440, 30);
      }

      function checkPixels() {
        const probe = new Engine({
          width: 200,
          height: 200,
          pixelRatio: 1,
          antialias: false,
          clear: '#000000',
        });
        const slab = probe.box(0, 0, 0, 0.2, 2, 4, '#ff0000');
        probe.canvas.draw();
        const center = sampleWorld(probe.canvas, 0, 0, 0);
        const aside = sampleWorld(probe.canvas, 1.2, 0, 0);
        expect(!center.behind && isRed(center), 'yaw 0 center ' + fmt(center));
        expect(!aside.behind && isBlack(aside), 'yaw 0 side ' + fmt(aside));
        slab.yaw = Math.PI / 2;
        probe.canvas.draw();
        const turned = sampleWorld(probe.canvas, 1.2, 0, 0);
        const outside = sampleWorld(probe.canvas, 3, 0, 0);
        expect(!turned.behind && isRed(turned), 'yaw half face ' + fmt(turned));
        expect(!outside.behind && isBlack(outside), 'yaw half outside ' + fmt(outside));

        const glassHost = new Canvas({
          width: 80,
          height: 48,
          pixelRatio: 1,
          antialias: false,
          clear: '#000000',
        });
        const glass = new Terminal({
          cols: 4,
          rows: 2,
          canvas: glassHost,
          cellWidth: 16,
          cellHeight: 20,
          showCursor: false,
        });
        glass.set(0, 0, { ch: ' ', bg: 1 });
        const ink = sampleScreen(glassHost, 4, 4);
        expect(ink.r >= 165 && ink.r <= 175 && ink.g < 8 && ink.b < 8, 'ansi red cell ' + fmt(ink));
      }
    } catch (error) {
      const message = error instanceof Error ? error.message : String(error);
      problems.push(message);
      document.body.dataset.ee = problems.join('; ');
    }

    function near(vector, x, y, z) {
      return Math.abs(vector.x - x) < 1e-4
        && Math.abs(vector.y - y) < 1e-4
        && Math.abs(vector.z - z) < 1e-4;
    }

    function sampleWorld(canvas, x, y, z) {
      const projected = canvas.project(x, y, z);
      const gl = canvas.gl;
      const w = canvas.element.width;
      const h = canvas.element.height;
      const px = Math.min(w - 1, Math.max(0, Math.floor((projected.x * 0.5 + 0.5) * w)));
      const py = Math.min(h - 1, Math.max(0, Math.floor((projected.y * 0.5 + 0.5) * h)));
      const buf = new Uint8Array(4);
      gl.readPixels(px, py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      return { r: buf[0], g: buf[1], b: buf[2], a: buf[3], behind: projected.behind, px, py };
    }

    function sampleScreen(canvas, x, yFromTop) {
      const gl = canvas.gl;
      const h = canvas.element.height;
      const buf = new Uint8Array(4);
      gl.readPixels(x, h - 1 - yFromTop, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, buf);
      return { r: buf[0], g: buf[1], b: buf[2], a: buf[3] };
    }

    function isRed(color) {
      return color.r > 80 && color.r > color.g * 2 && color.r > color.b * 2;
    }

    function isBlack(color) {
      return color.r < 20 && color.g < 20 && color.b < 20;
    }

    function fmt(color) {
      return `${color.r},${color.g},${color.b}`;
    }
  </script>
</body>
</html>
